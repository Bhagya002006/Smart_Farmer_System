<!DOCTYPE html>
<html>
<head>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h2>Place Order</h2>

<form method="POST">
    <label>Consumer ID:</label><br>
    <input type="number" name="consumer_id" required><br><br>

<br>
<a href="/">Back</a>

</body>
</html>
